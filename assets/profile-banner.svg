<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260" role="img" aria-labelledby="title desc">
  <title id="title">Utkarsh Jain — AI and Full-Stack Developer</title>
  <desc id="desc">A dark, technical banner highlighting software engineering, AI, and building useful products.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#101b2b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#58a6ff"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <radialGradient id="halo">
      <stop offset="0" stop-color="#2389e8" stop-opacity=".2"/>
      <stop offset="1" stop-color="#2389e8" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#9ab4d0" stroke-opacity=".07" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="260" rx="16" fill="url(#background)"/>
  <rect x="1" y="1" width="1198" height="258" rx="15" fill="url(#grid)" stroke="#334155" stroke-opacity=".8"/>
  <circle cx="930" cy="120" r="280" fill="url(#halo)"/>
  <path d="M0 12H1200" stroke="url(#accent)" stroke-width="3" opacity=".9"/>
  <path d="M760 0L910 0L690 260H540Z" fill="#17263a" opacity=".48"/>
  <path d="M820 0L970 0L750 260H600Z" fill="#1b2d43" opacity=".28"/>

  <g font-family="Inter,Segoe UI,Arial,sans-serif">
    <text x="76" y="75" fill="#58a6ff" font-size="14" font-weight="700" letter-spacing="3">UTKARSH JAIN  /  DEVELOPER</text>
    <text x="72" y="143" fill="#f0f6fc" font-size="58" font-weight="760" letter-spacing="-2">Building what’s next.</text>
    <text x="76" y="181" fill="#c3d1e0" font-size="20" font-weight="500">AI engineering  ·  Full-stack systems  ·  Product thinking</text>
    <rect x="76" y="211" width="34" height="3" rx="1.5" fill="url(#accent)"/>
    <text x="122" y="217" fill="#8b9bb0" font-size="12" font-weight="600" letter-spacing="2">IDEATE  /  BUILD  /  SHIP</text>
  </g>

  <g transform="translate(890 36)" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="132" cy="92" r="94" stroke="#58a6ff" stroke-opacity=".2"/>
    <circle cx="132" cy="92" r="66" stroke="#58a6ff" stroke-opacity=".24" stroke-dasharray="3 8"/>
    <path d="M18 28H72V72H132V18H212M72 72V146H132V184H236" stroke="url(#accent)" stroke-width="2" stroke-opacity=".8"/>
    <path d="M132 18V-2M212 18V-2M236 184H258M18 28H-2" stroke="#58a6ff" stroke-opacity=".55" stroke-width="2"/>
    <g fill="#58a6ff" stroke="#0b1220" stroke-width="4">
      <circle cx="18" cy="28" r="6"/><circle cx="72" cy="72" r="7"/><circle cx="132" cy="18" r="6"/>
      <circle cx="132" cy="92" r="9"/><circle cx="132" cy="146" r="6"/><circle cx="212" cy="18" r="6"/>
      <circle cx="236" cy="184" r="7"/>
    </g>
    <g transform="translate(96 76)" stroke="#d8ecff" stroke-width="2.5">
      <path d="M-10 -12L-22 0L-10 12M10 -12L22 0L10 12M4 -17L-4 17"/>
    </g>
  </g>
  <text x="1115" y="238" text-anchor="end" fill="#71849b" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="11" letter-spacing="1">01 — MAKE IT USEFUL</text>
</svg>