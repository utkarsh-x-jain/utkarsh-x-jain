<svg xmlns="http://www.w3.org/2000/svg" width="720" height="220" viewBox="0 0 720 220" role="img" aria-labelledby="t d"><title id="t">EstateIQ house price prediction animation</title><desc id="d">A house is evaluated by machine learning models and produces a predicted price.</desc><defs><linearGradient id="g" x2="1"><stop stop-color="#8b5cf6"/><stop offset="1" stop-color="#22d3ee"/></linearGradient></defs><rect width="720" height="220" rx="16" fill="#111827"/><g stroke="#263449" opacity=".6"><path d="M0 55H720M0 110H720M0 165H720"/></g><text x="28" y="34" fill="#c4b5fd" font-family="Arial" font-size="13" font-weight="700" letter-spacing="2">ESTATEIQ · PROPERTY PRICE INTELLIGENCE</text><g transform="translate(54 72)"><path d="M12 50L78 0l66 50v78H12Z" fill="#312e81" stroke="#a78bfa" stroke-width="3"/><path d="M0 53L78 -8l78 61" fill="none" stroke="#c4b5fd" stroke-width="7" stroke-linejoin="round"/><rect x="64" y="78" width="29" height="50" rx="3" fill="#8b5cf6"/><rect x="25" y="63" width="25" height="24" fill="#67e8f9"/><rect x="109" y="63" width="25" height="24" fill="#67e8f9"/></g><g stroke="url(#g)" stroke-width="3" fill="none" stroke-dasharray="7 7"><path d="M220 125H310"><animate attributeName="stroke-dashoffset" from="28" to="0" dur="1s" repeatCount="indefinite"/></path><path d="M460 125H540"><animate attributeName="stroke-dashoffset" from="28" to="0" dur="1s" repeatCount="indefinite"/></path></g><g transform="translate(310 72)"><rect width="150" height="106" rx="12" fill="#1e1b4b" stroke="#8b5cf6"/><g fill="#a78bfa"><rect x="25" y="27" width="18" height="48" rx="4"><animate attributeName="height" values="32;48;38;48" dur="2s" repeatCount="indefinite"/><animate attributeName="y" values="43;27;37;27" dur="2s" repeatCount="indefinite"/></rect><rect x="66" y="18" width="18" height="57" rx="4"><animate attributeName="height" values="57;42;57" dur="2.4s" repeatCount="indefinite"/><animate attributeName="y" values="18;33;18" dur="2.4s" repeatCount="indefinite"/></rec