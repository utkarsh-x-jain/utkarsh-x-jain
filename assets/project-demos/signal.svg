<svg xmlns="http://www.w3.org/2000/svg" width="720" height="220" viewBox="0 0 720 220" role="img" aria-labelledby="t d"><title id="t">Signal infrastructure early warning animation</title><desc id="d">Infrastructure nodes send telemetry to a risk analysis engine which raises an early warning.</desc><defs><linearGradient id="g" x2="1"><stop stop-color="#2563eb"/><stop offset="1" stop-color="#22d3ee"/></linearGradient><filter id="glow"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><rect width="720" height="220" rx="16" fill="#111827"/><g stroke="#243247" opacity=".65"><path d="M0 55H720M0 110H720M0 165H720M120 0V220M240 0V220M360 0V220M480 0V220M600 0V220"/></g><text x="28" y="34" fill="#93c5fd" font-family="Arial" font-size="13" font-weight="700" letter-spacing="2">LIVE INFRASTRUCTURE MONITOR</text><g transform="translate(44 70)"><rect width="142" height="104" rx="12" fill="#172554" stroke="#3b82f6"/><path d="M28 70V48h18v22m10 0V28h18v42m10 0V40h18v30" fill="none" stroke="#60a5fa" stroke-width="5" stroke-linejoin="round"/><text x="71" y="91" fill="#bfdbfe" font-family="Arial" font-size="12" text-anchor="middle">Infrastructure</text></g><g stroke="url(#g)" stroke-width="3" fill="none" stroke-dasharray="8 8"><path d="M190 122H286"><animate attributeName="stroke-dashoffset" from="32" to="0" dur="1.1s" repeatCount="indefinite"/></path><path d="M432 122H526"><animate attributeName="stroke-dashoffset" from="32" to="0" dur="1.1s" repeatCount="indefinite"/></path></g><g transform="translate(290 70)"><rect width="140" height="104" rx="12" fill="#172554" stroke="#6366f1"/><circle cx="70" cy="42" r="20" fill="none" stroke="#a5b4fc" stroke-width="3"/><path d="M70 42L83 29M70 42V27" stroke="#c4b5fd" stroke-width="3" stroke-linecap="round"><animateTransform attributeName="transform" type="rotate" from="0 70 42" to="360 70 42" dur="4s" repeatCount="indefinite"/></path><text x="70" y="91" fill="#c7d2fe" font-family="Arial" font-size="12" text-anchor="middle">Risk analysis</text></g><g transform="translate(530 70)"><rect width="146" height="104" rx="12" fill="#052e2b" stroke="#10b981"/><circle cx="73" cy="39" r="21" fill="#064e3b" stroke="#34d399" stroke-width="2" filter="url(#glow)"><animate attributeName="r" values="18;23;18" dur="1.8s" repeatCount="indefinite"/></circle><path d="M73 27V43M73 51V54" stroke="#a7f3d0" stroke-width="4" stroke-linecap="round"/><text x="73" y="91" fill="#a7f3d0" font-family="Arial" font-size="12" text-anchor="middle">Early warning</text></g><circle r="5" fill="#67e8f9"><animateMotion dur="2.2s" repeatCount="indefinite" path="M190 122H526"/></circle><text x="360" y="204" fill="#64748b" font-family="Arial" font-size="11" text-anchor="middle">DETECT  →  ANALYSE  →  ALERT</text></svg>