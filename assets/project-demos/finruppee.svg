<svg xmlns="http://www.w3.org/2000/svg" width="720" height="220" viewBox="0 0 720 220" role="img" aria-labelledby="t d"><title id="t">FinRuppee digital payments animation</title><desc id="d">A payment moves from a phone checkout through secure processing to a successful confirmation.</desc><rect width="720" height="220" rx="16" fill="#111827"/><text x="28" y="34" fill="#67e8f9" font-family="Arial" font-size="13" font-weight="700" letter-spacing="2">FINRUPPEE · PAYMENT EXPERIENCE</text><g transform="translate(90 54)"><rect width="116" height="142" rx="18" fill="#172554" stroke="#60a5fa" stroke-width="3"/><rect x="12" y="17" width="92" height="104" rx="8" fill="#0f172a"/><rect x="27" y="34" width="62" height="9" rx="4" fill="#334155"/><rect x="27" y="51" width="45" height="7" rx="3" fill="#334155"/><rect x="27" y="70" width="62" height="29" rx="7" fill="#2563eb"/><text x="58" y="89" fill="white" font-family="Arial" font-size="11" text-anchor="middle">PAY ₹499</text><circle cx="58" cy="132" r="4" fill="#93c5fd"/></g><path d="M226 125H320" stroke="#22d3ee" stroke-width="3" stroke-dasharray="7 7"><animate attributeName="stroke-dashoffset" from="28" to="0" dur=".9s" repeatCount="indefinite"/></path><g transform="translate(324 72)"><rect width="132" height="106" rx="14" fill="#172554" stroke="#818cf8"/><path d="M66 20L94 31V54c0 18-12 29-28 37C50 83 38 72 38 54V31Z" fill="#312e81" stroke="#a5b4fc" stroke-width="2"/><path d="M54 51l9 9 18-21" fill="none" stroke="#c4b5fd" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><animate attributeName="opacity" values=".35;1;1" dur="1.5s" repeatCount="indefinite"/></path><text x="66" y="96" fill="#c7d2fe" font-family="Arial" font-size="11" text-anchor="middle">Secure processing</text></g><path d="M466 125H554" stroke="#34d399" stroke-width="3" stroke-dasharray="7 7"><animate attributeName="stroke-dashoffset" from="28" to="0" dur=".9s" repeatCount="indefinite"/></path><g transform="translate(560 76)"><circle cx="60" cy=