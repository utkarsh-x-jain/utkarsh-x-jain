<svg xmlns="http://www.w3.org/2000/svg" width="720" height="220" viewBox="0 0 720 220" role="img" aria-labelledby="t d"><title id="t">SC Disruption database engineering animation</title><desc id="d">Application services exchange data with an API and PostgreSQL database in a collaborative system.</desc><rect width="720" height="220" rx="16" fill="#111827"/><g stroke="#263449" opacity=".6"><path d="M0 55H720M0 110H720M0 165H720"/></g><text x="28" y="34" fill="#93c5fd" font-family="Arial" font-size="13" font-weight="700" letter-spacing="2">SC DISRUPTION · SYSTEM DATA FLOW</text><g transform="translate(46 76)"><rect width="145" height="100" rx="12" fill="#172554" stroke="#60a5fa"/><rect x="24" y="22" width="97" height="12" rx="4" fill="#3b82f6"/><rect x="24" y="45" width="72" height="8" rx="4" fill="#475569"/><rect x="24" y="62" width="88" height="8" rx="4" fill="#475569"/><text x="72" y="89" fill="#bfdbfe" font-family="Arial" font-size="11" text-anchor="middle">Application</text></g><g stroke="#38bdf8" stroke-width="3" fill="none" stroke-dasharray="6 7"><path d="M195 126H293"><animate attributeName="stroke-dashoffset" from="26" to="0" dur="1s" repeatCount="indefinite"/></path><path d="M428 126H526"><animate attributeName="stroke-dashoffset" from="26" to="0" dur="1s" repeatCount="indefinite"/></path></g><g transform="translate(296 76)"><rect width="130" height="100" rx="12" fill="#312e81" stroke="#818cf8"/><path d="M65 20L96 50 65 80 34 50Z" fill="#4338ca" stroke="#a5b4fc" stroke-width="2"/><circle cx="65" cy="50" r="9" fill="#c4b5fd"><animate attributeName="r" values="7;11;7" dur="1.8s" repeatCount="indefinite"/></circle><text x="65" y="94" fill="#ddd6fe" font-family="Arial" font-size="11" text-anchor="middle">API layer</text></g><g transform="translate(532 75)"><ellipse cx="68" cy="18" rx="58" ry="16" fill="#0c4a6e" stroke="#38bdf8" stroke-width="2"/><path d="M10 18V82c0 9 26 17 58 17s58-8 58-17V18" fill="#082f49" stroke="#38bdf8" stroke-width="2"/><path d="M10 42c0 9