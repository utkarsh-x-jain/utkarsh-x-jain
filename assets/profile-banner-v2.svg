<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260" role="img" aria-labelledby="title desc">
<title id="title">Utkarsh Jain — AI and Full-Stack Engineer</title>
<desc id="desc">A charcoal and electric-blue engineering banner with a neural network brain, code, database, analytics, and connected system motifs.</desc>
<defs>
